name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Annotate Kotlin and Gradle errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path("build.log")
          if not log.exists():
              raise SystemExit(0)
          seen = 0
          for raw in log.read_text(errors="replace").splitlines():
              m = re.match(r"e: file://(\S+?):(\d+):(\d+) (.+)$", raw.strip())
              if m:
                  path = m.group(1).split("/RetroBit-Agent/RetroBit-Agent/")[-1]
                  print(f"::error file={path},line={m.group(2)},col={m.group(3)},title=Kotlin::{m.group(4)}")
                  seen += 1
                  continue
              if "FAILURE: Build failed" in raw or "Execution failed for task" in raw or "What went wrong" in raw:
                  print(f"::error title=Gradle::{raw.strip()[:240]}")
              if seen > 120:
                  print("::error title=CI::Too many compile errors, see build.log")
                  break
          PY

      - name: Collect APK info
        if: success()
        run: |
          ls -l app/build/outputs/apk/debug/
          du -h app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: retrobit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            build.log
          if-no-files-found: ignore
          retention-days: 7
