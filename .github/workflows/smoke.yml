name: Smoke test (emulator)

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Install APK on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain assembleRelease
          ls -l app/build/outputs/apk/release/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install and launch
        id: device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            LOG=smoke.log
            : > $LOG
            run() {
              echo "\$ $*" >> $LOG
              "$@" >> $LOG 2>&1
              echo "exit=$?" >> $LOG
            }
            adb devices >> $LOG 2>&1
            adb shell getprop sys.boot_completed >> $LOG 2>&1
            adb install -r app/build/outputs/apk/release/app-release.apk >> $LOG 2>&1
            echo "install_exit=$?" >> $LOG
            adb shell pm list packages | grep dev.retrobit.agent >> $LOG 2>&1
            echo "package_exit=$?" >> $LOG
            adb logcat -c >> $LOG 2>&1
            adb shell am start -W -n dev.retrobit.agent/.MainActivity >> $LOG 2>&1
            echo "launch_exit=$?" >> $LOG
            sleep 15
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" >> $LOG 2>&1
            mkdir -p artifacts
            adb exec-out screencap -p > artifacts/dashboard.png 2>> $LOG
            adb logcat -d -b crash >> artifacts/crash.log 2>&1
            adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime" | head -60 >> artifacts/crash.log 2>&1
            cp $LOG artifacts/smoke.log
            tail -80 $LOG
            exit 0

      - name: Report smoke diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, urllib.parse

          log = pathlib.Path("smoke.log")
          text = log.read_text(errors="replace") if log.exists() else "(smoke.log tidak ada)"

          def annotate(level, title, body):
              body = urllib.parse.quote(body[-3000:], safe=" \n-_.:/=")
              print(f"::{level} title={title}::{body}")

          install_ok = re.search(r"install_exit=0", text) is not None
          launch_ok = re.search(r"launch_exit=0", text) is not None
          crashed = "FATAL EXCEPTION" in text
          resumed = "dev.retrobit.agent/" in text and "mResumedActivity" in text

          print(f"install={install_ok} launch={launch_ok} crash={crashed} resumed={resumed}")
          print(text[-4000:])

          problems = []
          if not install_ok:
              problems.append("adb install gagal")
          if crashed:
              problems.append("FATAL EXCEPTION di logcat")
          if not launch_ok:
              problems.append("am start gagal")
          if not resumed:
              problems.append("MainActivity tidak jadi activity terdepan")

          if problems:
              annotate("error", "Smoke gagal", " | ".join(problems) + "\n\n" + text[-2500:])
              sys.exit(1)
          annotate("notice", "Smoke OK", "APK terpasang dan MainActivity berjalan tanpa crash.")
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish screenshots to ci-artifacts branch
        if: always()
        run: |
          [ -d artifacts ] || { echo "no artifacts"; exit 0; }
          git config user.name "RetroBit CI"
          git config user.email "ci@retrobit.dev"
          git checkout -B ci-artifacts
          cp -r artifacts/. .
          git add -A
          git commit -m "Emulator screenshots for ${GITHUB_SHA}" || { echo "nothing to commit"; exit 0; }
          git push --force origin ci-artifacts
