name: Smoke test (emulator)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/smoke.yml"

permissions:
  contents: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Install APK on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm list packages | grep dev.retrobit.agent
            adb logcat -c
            adb shell am start -W -n dev.retrobit.agent/.MainActivity
            sleep 12
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity"
            mkdir -p artifacts
            adb exec-out screencap -p > artifacts/dashboard.png
            adb shell input tap 620 1990 || true
            sleep 3
            adb exec-out screencap -p > artifacts/dashboard-2.png
            echo "--- crash buffer ---"
            adb logcat -d -b crash | tee artifacts/crash.log
            echo "--- app errors ---"
            adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime.*dev.retrobit" | tee -a artifacts/crash.log || true
            if grep -q "FATAL EXCEPTION" artifacts/crash.log; then
              echo "::error title=Runtime crash::Aplikasi crash saat dibuka, lihat artifacts/crash.log"
              exit 1
            fi
            if ! adb shell dumpsys activity activities | grep -q "dev.retrobit.agent"; then
              echo "::error title=Launch failed::MainActivity tidak berjalan"
              exit 1
            fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish screenshots to ci-artifacts branch
        if: always()
        run: |
          if [ ! -d artifacts ]; then
            echo "no artifacts to publish"
            exit 0
          fi
          git config user.name "RetroBit CI"
          git config user.email "ci@retrobit.dev"
          git checkout -B ci-artifacts
          cp -r artifacts/* . || true
          git add -A dashboard.png dashboard-2.png crash.log 2>/dev/null || git add -A
          git commit -m "Emulator screenshots for ${GITHUB_SHA}" || exit 0
          git push --force origin ci-artifacts
