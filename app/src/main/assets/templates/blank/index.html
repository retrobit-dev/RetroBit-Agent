<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0A0A0A" />
<title>Aplikasi baru</title>
<style id="rb-design">
/*RB_DESIGN_START*/
:root{
  --rb-primary:#DEDED5;
  --rb-accent:#F4F4EC;
  --rb-bg:#0A0A0A;
  --rb-surface:#141413;
  --rb-text:#EAEAE2;
  --rb-muted:#8E8E86;
  --rb-radius:4px;
  --rb-font:'Pixel Operator',ui-monospace,'Courier New',monospace;
}
/*RB_DESIGN_END*/
@font-face{font-family:'Pixel Operator';src:url('assets/fonts/PixelOperator.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Pixel Operator';src:url('assets/fonts/PixelOperator-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--rb-bg);color:var(--rb-text);font-family:var(--rb-font);display:grid;place-items:center;padding:24px;overflow:hidden}
body::before{content:"";position:fixed;width:520px;height:520px;border-radius:50%;background:var(--rb-primary);filter:blur(160px);opacity:.28;top:-160px;left:-120px}
body::after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;background:var(--rb-accent);filter:blur(150px);opacity:.16;bottom:-180px;right:-100px}
.card{position:relative;z-index:1;max-width:440px;width:100%;background:color-mix(in srgb,var(--rb-surface) 82%,transparent);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:calc(var(--rb-radius) * 1.2);padding:38px 30px;text-align:center;box-shadow:0 40px 100px -40px #000}
.mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--rb-primary),var(--rb-accent));display:grid;place-items:center;font-size:26px;margin:0 auto 22px;box-shadow:0 16px 40px -14px var(--rb-primary)}
h1{font-size:26px;letter-spacing:-.035em;margin:0 0 12px}
p{font-size:13.5px;line-height:1.7;color:var(--rb-muted);margin:0 0 26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px}
.chips span{font-size:11px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:var(--rb-muted)}
.btn{width:100%;border:0;padding:15px;border-radius:calc(var(--rb-radius) * .7);background:linear-gradient(135deg,var(--rb-primary),var(--rb-accent));color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 16px 36px -18px var(--rb-primary);transition:.2s transform}
.btn:active{transform:scale(.98)}
.hint{font-size:10.5px;color:var(--rb-muted);margin-top:18px;letter-spacing:.02em}

/* retro cyberdeck: kill soft glows, snap radii to the token */
.glow{display:none!important}
</style>
</head>
<body>
  <main class="card">
    <div class="mark">✦</div>
    <h1>Mulai dari kanvas kosong</h1>
    <p>Minta AI membuat aplikasi impianmu. Semua file yang dihasilkan langsung tampil di preview ini — tanpa build, tanpa deploy.</p>
    <div class="chips"><span>Landing page</span><span>Dashboard</span><span>Aplikasi mobile</span><span>Katalog produk</span></div>
    <button class="btn" onclick="say()">Buka panel chat</button>
    <div class="hint">Preview · RetroBit Agent</div>
  </main>
<script>
  function say(){
    const card = document.querySelector('.card');
    card.animate(
      [{transform:'translateY(0)'},{transform:'translateY(-6px)'},{transform:'translateY(0)'}],
      {duration:420, easing:'ease-in-out'}
    );
  }
</script>
</body>
</html>
